name: Dependabot Auto-merge

# Merges Dependabot pull requests whose largest update is a patch or minor version once
# every other check has passed. Majors are left for a person. See STANDARDS.md in
# tinkerologie/.github.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  auto-merge:
    name: Auto-merge
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    uses: tinkerologie/.github/.github/workflows/dependabot-auto-merge.yml@d0f9f9b745d716bd70ccd4e1f8580a1e3082b80e # v1.5.5
    permissions:
      contents: write # merge the pull request
      pull-requests: write # merge the pull request
      checks: read # wait for check runs
      statuses: read # wait for commit statuses
