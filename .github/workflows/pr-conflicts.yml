name: Pull Request Conflicts

# Labels and comments on PRs that conflict with the default branch, because
# GitHub does not notify authors. Runs after every merge to main and on
# PR updates. No PR code is checked out, so pull_request_target is safe.
on:
  push:
    branches: [main]
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  conflicts:
    permissions:
      contents: read # read the default branch to compute mergeability
      pull-requests: write # add/remove the conflicts label and comment on pull requests
    uses: tinkerologie/.github/.github/workflows/pr-conflicts.yml@d656cb424398f328446d036df4724e3f89b5b5ec # v1.1.0
