name: Issue Type Labeler

# Labels issues that have neither `bug` nor `enhancement` so CodeRabbit can
# generate a coding plan. See tinkerologie/.github GOVERNANCE.md.
on:
  issues:
    types: [opened, edited, reopened]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  label:
    permissions:
      issues: write # add bug/enhancement labels, and create them if missing
    uses: tinkerologie/.github/.github/workflows/issue-labeler.yml@d656cb424398f328446d036df4724e3f89b5b5ec # v1.1.0
