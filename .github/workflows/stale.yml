name: Stale Issues And Pull Requests

# Stale after 14 days without activity, closed 30 days after that.
on:
  schedule:
    - cron: "41 1 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  stale:
    permissions:
      issues: write
      pull-requests: write
    uses: tinkerologie/.github/.github/workflows/stale.yml@v1
