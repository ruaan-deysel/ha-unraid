name: Enhancement request
description: Request a new feature, capability, or architectural improvement.
title: "[Enhancement]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for proposing an enhancement. Complete this form with clear problem context, proposed architecture, and acceptance criteria so contributors, AI agents, and CodeRabbit AI (@coderabbitai plan) can generate a concrete implementation plan.
  - type: dropdown
    id: affected-area
    attributes:
      label: Affected area
      description: Which part of the project would this improve most directly?
      options:
        - Coordinator and data updates
        - Entity platforms (sensors, binary sensors, switches, buttons, etc.)
        - Config flow and options flow
        - Upstream API client and authentication
        - Diagnostics and repairs
        - Services and actions
        - Documentation
        - CI and repository automation
    validations:
      required: true
  - type: textarea
    id: problem-statement
    attributes:
      label: Problem statement
      description: What problem, limitation, or friction does this enhancement solve?
      placeholder: Explain the user problem or use case first, not just the proposed fix.
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed solution and architecture
      description: Describe the desired capability, new APIs, entities, or components. Mention specific modules or interfaces to touch.
      placeholder: Detail the architectural approach and implementation design.
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: List the verifiable conditions required to consider this enhancement complete. This gives AI agents and CodeRabbit a clear plan target.
      placeholder: |
        - [ ] New functionality exposed with full test coverage
        - [ ] Linter and type checks pass locally
        - [ ] Documentation and CHANGELOG.md updated under [Unreleased]
    validations:
      required: true
  - type: textarea
    id: alternatives-considered
    attributes:
      label: Alternatives considered
      description: Share workarounds, alternative APIs, or other approaches already considered.
      placeholder: Describe alternative options and why they were not chosen.
    validations:
      required: false
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add examples, API documentation links, mockups, or operational context.
      placeholder: Any supporting links, design specs, or diagrams.
    validations:
      required: false
  - type: checkboxes
    id: confirmations
    attributes:
      label: Pre-submission confirmations
      options:
        - label: I searched existing open and closed issues before opening this request.
          required: true
        - label: I confirm this request targets ha-unraid, not upstream Home Assistant core.
          required: true
        - label: I provided sufficient technical context and acceptance criteria for plan generation.
          required: true
        - label: I read and agree to follow repository contribution rules and guidelines.
          required: true
